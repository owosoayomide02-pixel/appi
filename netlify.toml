# Netlify: Next.js website + operator (apps/web)
# FastAPI brain must be hosted separately; set NEXT_PUBLIC_API_URL in Netlify env.

[build]
  base = "apps/web"
  command = "npm ci && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Production site: https://appi-project01.netlify.app
# Set in Netlify UI → Site settings → Environment variables:
#   NEXT_PUBLIC_APP_URL=https://appi-project01.netlify.app
#   NEXT_PUBLIC_API_URL=https://your-api.example.com
#   NEXT_PUBLIC_SUPABASE_URL=...
#   NEXT_PUBLIC_SUPABASE_ANON_KEY=...
#   NEXT_PUBLIC_GITHUB_REPO=owosoayomide02-pixel/appi
#   NEXT_PUBLIC_DOWNLOAD_WINDOWS_URL=...
#   NEXT_PUBLIC_DOWNLOAD_MACOS_URL=...
#   NEXT_PUBLIC_DOWNLOAD_LINUX_URL=...

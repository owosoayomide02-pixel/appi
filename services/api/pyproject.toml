[project]
name = "appi-api"
version = "0.1.0"
description = "Appi V0.1 FastAPI brain, permissions, memory, and audit service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "PyJWT>=2.10.0",
  "bcrypt>=4.2.0",
  "cryptography>=44.0.0",
  "httpx>=0.28.0",
  "websockets>=14.0",
  "jsonschema>=4.23.0",
  "python-multipart>=0.0.18",
  "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "appi-device-agent"
version = "0.1.0"
description = "Windows-first Appi device agent"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "websockets>=14.0",
  "pydantic-settings>=2.6.0",
  "playwright>=1.49.0",
  "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]
tray = [
  "pystray>=0.19.5",
  "pillow>=10.0.0",
]
voice_ui = [
  "PyQt6>=6.6.0",
  "numpy>=1.26.0",
]

[project.scripts]
appi-agent = "app.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "../runtime-core", "../../services/voice"]
testpaths = ["tests"]
